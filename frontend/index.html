<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterviewPrep — JD Interview Cheatsheet</title>

    <link rel="stylesheet" href="/opensource-style.css">

    <style>
        :root {
            --bg:#080b12;
            --panel:rgba(18,23,34,.88);
            --panel2:#111725;
            --text:#eef2ff;
            --muted:#94a3b8;
            --accent:#6c63ff;
            --teal:#22d3b8;
            --border:rgba(255,255,255,.09);
        }

        * { box-sizing:border-box; }

        body {
            margin:0;
            background:
                radial-gradient(circle at 10% 10%,rgba(108,99,255,.13),transparent 30%),
                radial-gradient(circle at 90% 20%,rgba(34,211,184,.08),transparent 28%),
                var(--bg);
            color:var(--text);
            font-family:Inter,system-ui,sans-serif;
        }

        .app { display:flex; min-height:100vh; }

        .sidebar {
            width:245px;
            position:fixed;
            inset:0 auto 0 0;
            padding:25px 16px;
            border-right:1px solid var(--border);
            background:rgba(8,11,18,.92);
            backdrop-filter:blur(18px);
            z-index:10;
        }

        .brand {
            font-size:21px;
            font-weight:800;
            padding:10px 12px 25px;
        }

        .brand span { color:var(--teal); }

        .nav button {
            width:100%;
            border:0;
            background:transparent;
            color:var(--muted);
            padding:12px;
            margin:3px 0;
            text-align:left;
            border-radius:10px;
            cursor:pointer;
            font-size:14px;
        }

        .nav button:hover,
        .nav button.active {
            background:rgba(108,99,255,.14);
            color:white;
        }

        main {
            margin-left:245px;
            width:calc(100% - 245px);
            padding:35px;
            max-width:1500px;
        }

        .top {
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:20px;
            margin-bottom:25px;
        }

        h1 { margin:0; font-size:34px; }
        .subtitle { color:var(--muted); margin-top:7px; }

        .badge {
            padding:8px 13px;
            border-radius:999px;
            background:rgba(34,211,184,.1);
            color:var(--teal);
            border:1px solid rgba(34,211,184,.2);
            font-size:12px;
        }

        .input-card,.card {
            background:var(--panel);
            border:1px solid var(--border);
            border-radius:18px;
            padding:22px;
            box-shadow:0 18px 50px rgba(0,0,0,.18);
            backdrop-filter:blur(14px);
        }

        textarea {
            width:100%;
            min-height:220px;
            resize:vertical;
            margin-top:12px;
            padding:17px;
            border-radius:13px;
            border:1px solid var(--border);
            background:#0b101b;
            color:white;
            outline:none;
            font:14px/1.6 Inter,system-ui,sans-serif;
        }

        textarea:focus { border-color:var(--accent); }

        .actions {
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-top:15px;
            gap:15px;
        }

        .generate {
            border:0;
            padding:12px 20px;
            border-radius:10px;
            color:white;
            background:linear-gradient(135deg,var(--accent),#5148e8);
            cursor:pointer;
            font-weight:700;
        }

        .generate:hover { transform:translateY(-1px); }

        #status { color:var(--muted); font-size:13px; }

        #results {
            display:none;
            margin-top:28px;
        }

        .hero {
            display:grid;
            grid-template-columns:2fr 1fr;
            gap:16px;
            margin-bottom:16px;
        }

        .role {
            font-size:27px;
            font-weight:800;
            margin:8px 0;
        }

        .skills {
            display:flex;
            flex-wrap:wrap;
            gap:8px;
        }

        .skill {
            background:rgba(108,99,255,.14);
            border:1px solid rgba(108,99,255,.25);
            color:#c9c5ff;
            padding:7px 10px;
            border-radius:999px;
            font-size:12px;
        }

        .grid {
            display:grid;
            grid-template-columns:repeat(2,minmax(0,1fr));
            gap:16px;
        }

        .full { grid-column:1/-1; }

        .card h2 {
            font-size:17px;
            margin:0 0 14px;
        }

        .card ul {
            margin:0;
            padding-left:20px;
            color:#cbd5e1;
        }

        .card li { margin:9px 0; line-height:1.45; }

        .q {
            padding:12px 0;
            border-bottom:1px solid var(--border);
            color:#dbe4f0;
        }

        .q:last-child { border-bottom:0; }

        .q b { color:white; }

        .skill-row {
            border:1px solid var(--border);
            border-radius:12px;
            padding:13px;
            margin:8px 0;
        }

        .skill-row strong { color:var(--teal); }

        .empty {
            color:var(--muted);
            font-size:14px;
        }


        @media(max-width:900px) {
            .sidebar {
                position:static;
                width:100%;
                height:auto;
            }

            .app { display:block; }
            main { margin:0; width:100%; padding:16px; }

            .top {
                flex-direction:column;
                align-items:flex-start;
                gap:12px;
            }

            h1 { font-size:30px; line-height:1.05; }

            .subtitle {
                max-width:100%;
                font-size:15px;
                line-height:1.45;
            }

            .badge {
                align-self:flex-start;
            }

            .hero,.grid { grid-template-columns:1fr; }

            .input-card,.card {
                padding:16px;
                border-radius:15px;
            }

            textarea {
                min-height:240px;
                font-size:14px;
            }

            .actions {
                flex-direction:column;
                align-items:stretch;
            }

            #status {
                min-height:20px;
            }

            .generate {
                width:100%;
                padding:14px 16px;
                font-size:15px;
            }

            #results .card {
                overflow:hidden;
            }

            #generatedCheatSheetImage {
                width:100%;
                max-width:100%;
                height:auto;
            }
        }

    </style>
</head>

<body>
<div class="app">

    <aside class="sidebar">
        <div class="brand">Interview<span>Prep</span></div>

        <div class="nav">
            <button class="active" onclick="scrollToId('generator')">? JD Generator</button>
            <button onclick="scrollToId('overview')">? Overview</button>
            <button onclick="scrollToId('skills')">? Skills</button>
            <button onclick="scrollToId('technical')">? Technical</button>
            <button onclick="scrollToId('roleQuestions')">? Role Questions</button>
            <button onclick="scrollToId('hr')">? HR Questions</button>
            <button onclick="scrollToId('projects')">? Projects</button>
            <button onclick="scrollToId('revision')">? Revision</button>
        </div>
    </aside>

    <main>

        <div class="top">
            <div>
                <h1>JD ? Interview Cheatsheet</h1>
                <div class="subtitle">
                    Paste a Job Description and generate a complete interview preparation guide.
                </div>
            </div>
            <div class="badge">JD Based Preparation</div>
        </div>

        <section id="generator" class="input-card">
            <h2>Paste Job Description</h2>

            <textarea id="jd"
                placeholder="Paste the complete Job Description here..."></textarea>

            <div class="actions">
                <span id="status">Ready to generate your cheatsheet.</span>
                <button class="generate" onclick="generate()">Generate Cheatsheet ?</button>
            </div>
        </section>

        <section id="results">
            <div class="card">
                <img id="generatedCheatSheetImage"
                     alt="Generated Technical Interview Cheat Sheet"
                     style="width:100%;max-width:1000px;display:block;margin:0 auto;border-radius:12px;">
            </div>
        </section>
    </main>
</div>

<script src="/app.js"></script>
</body>
</html>
